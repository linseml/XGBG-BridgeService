apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'maven-publish'

android {
    namespace 'com.ddmh.bridge.service'
    //noinspection GradleDependency
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
}

// JitPack 发布配置
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.ddmh'
                artifactId = 'bridge-service'
                version = project.findProperty('libVersion') ?: '1.0.0'

                pom {
                    name = 'BridgeService'
                    description = 'Android bridge service library for DDMH XGBG'
                    url = 'https://github.com/linseml/XGBG-BridgeService'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'Leesin'
                            name = 'Leesin'
                        }
                    }
                    scm {
                        url = 'https://github.com/linseml/XGBG-BridgeService'
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    api 'com.google.code.gson:gson:2.14.0'

    // XPopup — 公开基类继承 XPopup 类型（XPopupBottom/Center/Position/Attach/Drawer）
    api 'com.github.li-xiaojun:XPopup:2.10.0'

    // SmartRefreshLayout
    api 'io.github.scwang90:refresh-layout-kernel:2.1.0'
    api 'io.github.scwang90:refresh-header-classics:2.1.0'

    // AppsFlyer 归因 — 公开 API 仅用标准类型，SDK 类型全部内部使用
    api 'com.appsflyer:af-android-sdk:6.18.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.appsflyer:purchase-connector:2.2.0'

    //数数Agentic Engine — 公开 API 仅用 JSONObject/HashMap，SDK 类型全部内部使用
    implementation 'cn.thinkingdata.android:ThinkingAnalyticsSDK:3.4.2'

    // Firebase Analytics — 公开 API 仅用 Bundle/HashMap/String，SDK 类型全部内部使用
    implementation platform('com.google.firebase:firebase-bom:33.13.0')
    implementation 'com.google.firebase:firebase-analytics'

    //Google支付 — 公开 API 暴露 Purchase/ProductDetails/BillingClient 类型（OnPayResultListener、GooglePay）
    api 'com.android.billingclient:billing:8.3.0'
}